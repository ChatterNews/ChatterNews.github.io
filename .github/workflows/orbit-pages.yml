name: Publish Orbit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbit-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatter
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chatter/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run test:website && npm run test:reader && npm run test:desktop
      - run: npm run fetch-models
      - run: npm run package:website
        env:
          ORBIT_WEB_RELEASE: web-${{ github.sha }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: chatter/dist/Orbit-Website-web-${{ github.sha }}/site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
