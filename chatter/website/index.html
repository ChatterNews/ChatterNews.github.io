<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#282144"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./loading.css"><title>Orbit · Chatter News</title>
</head>
<body data-state="busy">
  <main class="orbit-loading-screen">
    <section class="orbit-loading" aria-labelledby="status">
      <div role="status" aria-live="polite"><h1 id="status">Opening your desk…</h1><p id="detail">Getting Chatter News ready.</p></div>
      <progress id="progress" max="100" aria-label="Opening your desk"></progress>
      <p id="progress-label"></p>
      <div class="actions"><button id="resume" type="button" hidden>Try opening again</button><button id="cancel" type="button" hidden>Cancel preparation</button></div>
      <p id="update-note" hidden>A new version is getting ready.</p>
      <a href="./privacy.html">Privacy and school information</a>
      <noscript>Turn on JavaScript to open Chatter News.</noscript>
    </section>
  </main><script type="module" src="./start.js"></script>
</body></html>
